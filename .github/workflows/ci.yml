name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg and a caption font
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
            echo "NOOKCUT_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" >> "$GITHUB_ENV"
          else
            brew install ffmpeg
          fi
      - name: Install NookCut
        run: python -m pip install -e ".[mcp]"
      - name: Unit tests
        run: python -m unittest discover tests -v
      - name: MCP smoke test (stdio + HTTP)
        run: python tests/mcp_smoke.py
